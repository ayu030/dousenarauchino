<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ｜どうせならうちのこ</title>
  <meta name="description" content="うちの子Tシャツテンプレートやオリジナルデザインのオーダーに関するお問い合わせはこちらから。">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-sub: #f8f9fa;
      --accent: #0b57d0;
      --accent-hover: #0842a0;
      --text-main: #202124;
      --text-sub: #5f6368;
      --border: #e8eaed;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      letter-spacing: 0.025em;
    }
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .logo { font-size: 17px; font-weight: 700; color: var(--text-main); text-decoration: none; }
    nav a {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-sub);
      text-decoration: none;
    }
    nav a:hover { color: var(--text-main); }
    .page-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 64px 24px 88px;
      text-align: center;
    }
    .page-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 16px;
    }
    .lead {
      font-size: 14px;
      line-height: 1.9;
      color: var(--text-sub);
      margin-bottom: 40px;
    }
    .contact-box {
      background: var(--bg-sub);
      border-radius: 16px;
      padding: 32px 24px;
      margin-bottom: 24px;
    }
    .contact-box h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .contact-box p {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.8;
      margin-bottom: 18px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 12px 28px;
      border-radius: 100px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s, transform 0.12s;
    }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .note {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.8;
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-logo { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .footer-copy { font-size: 11px; color: var(--text-sub); }
    .footer-links { display: flex; gap: 16px; }
    .footer-links a { font-size: 11px; color: var(--text-sub); text-decoration: none; }
    .footer-links a:hover { color: var(--accent); }
    @media (max-width: 600px) {
      header { padding: 0 20px; }
      footer { padding: 24px; flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">どうせならうちのこ</a>
    <nav>
      <a href="index.html">トップへ戻る</a>
    </nav>
  </header>

  <div class="page-wrap">
    <p class="page-label">Contact</p>
    <h1>お問い合わせ</h1>
    <p class="lead">オリジナルデザインのオーダー、テンプレートの使い方、印刷に関するご相談など、お気軽にご連絡ください。</p>

    <div class="contact-box">
      <h2>メールでのお問い合わせ</h2>
      <p>ご質問・オーダーのご相談は、下記メールアドレスまでご連絡ください。2〜3日以内にご返信いたします。</p>
      <a href="mailto:ayuka030@gmail.com" class="btn-primary">メールを送る</a>
    </div>

    <p class="note">オーダーをご希望の方は、参考にしたいテンプレート番号・ご希望のペットの写真・仕上がりイメージを添えていただくとスムーズです。</p>
  </div>

  <footer>
    <div class="footer-logo">どうせならうちのこ</div>
    <div class="footer-links">
      <a href="contact.html">お問い合わせ</a>
      <a href="privacy-policy.html">プライバシーポリシー</a>
    </div>
    <div class="footer-copy">© 2026 どうせならうちのこ. All rights reserved.</div>
  </footer>

</body>
</html>
